# kitty.conf — main kitty terminal (the kol-notes sticky uses its own
# kol-notes.conf and never reads this file).
# Symlinked to ~/.config/kitty/kitty.conf by bootstrap.sh.
#
# MIRRORS ghostty (ghostty/config) setting-for-setting — 2026-07-29. If you
# change one terminal, change the other. No kitty equivalent exists for
# ghostty's window-save-state (macOS restore) or alpha-blending; noted, skipped.

# ── Font — same Nerd Font as ghostty/p10k, ligatures off ─────────────────────
font_family      MesloLGS NF
font_size        14.0
disable_ligatures always
# Shade blocks ░▒▓ pinned to the font (ghostty font-codepoint-map mirror) —
# keeps p10k's dithered prompt heads if the family ever changes.
symbol_map U+2591-U+2593 MesloLGS NF

# ── macOS / input ────────────────────────────────────────────────────────────
# Option = Alt, so shell word-nav (Alt-B/F) and fzf Alt-C work (ghostty
# macos-option-as-alt mirror).
macos_option_as_alt yes

# Cmd-key line editing, mirroring ghostty's defaults + its tmux-prefix fix:
# Cmd+← = Ctrl+A ×2 (first wakes the tmux prefix, second passes a literal
# line-start through) · Cmd+→ = Ctrl+E · Cmd+Backspace = Ctrl+U.
map cmd+left      send_text all \x01\x01
map cmd+right     send_text all \x05
map cmd+backspace send_text all \x15

# Claude Code: shift+enter → newline instead of submit. kitty sends a plain
# CR for shift+enter by default; ESC+CR is meta-enter, which Claude Code
# (and most readline TUIs) treat as a soft line break.
map shift+enter send_text all \x1b\r

# Solid non-blinking block cursor (ghostty cursor-style mirror; color comes
# from the theme include, same as ghostty's).
cursor_shape block
cursor_blink_interval 0

# ── Window / splits ──────────────────────────────────────────────────────────
hide_window_decorations titlebar-only
window_padding_width    10
background_opacity      1.0
confirm_os_window_close 0
# Dim inactive split text; uniform warm-grey divider (gruvbox bg3) — mirrors
# ghostty unfocused-split-opacity 0.55 + split-divider-color.
inactive_text_alpha   0.55
active_border_color   #504945
inactive_border_color #504945

# ── Clipboard / QoL ──────────────────────────────────────────────────────────
# Let terminal apps read the clipboard (OSC-52 yanks) — ghostty clipboard-read mirror.
clipboard_control write-clipboard write-primary read-clipboard read-primary no-append
# Hide the pointer while typing (negative = macOS hide-on-keypress).
mouse_hide_wait -1

# kol-theme (symlink managed by bin/kol-theme; kitty warns-and-continues if
# it's missing). Sets colors/bg/cursor — same palette source as ghostty's
# current-theme.conf, so both terminals shift together. LAST so it wins.
# Running windows: ctrl+shift+f5 reloads, or quit+relaunch.
include current-theme.conf
